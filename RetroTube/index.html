<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RetroTube</title>
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="search.css">
</head>
<body>
    <header>
        <logo class="logo">
            <a href="index.html"><img class="logo" src="Assets/logo.png/logo.png" alt="Logo"></a>
        </logo>

        <search class="search">
            <input type="text" id="searchInput" placeholder="search for ...">
            <button id="searchButton">
                <img src="Assets/icons/eye icon.png">
            </button>
        </search>

        <button class="menu-btn">
            <img src="Assets/icons/menu icon.png" alt="MovieFinder">
            <img src="Assets/icons/legal icon.png" alt="Legal Situation">
        </button>
    </header>
    <script src="main.js"></script>
</body>
</html>
