<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RetroTube</title>
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="search.css">
    <link rel="stylesheet" href="mobile.css">
</head>
<body>
    <header>
        <logo class="logo">
            <a href="index.html"><img class="logo" src="Assets/logo.png/logo.png" alt="Logo"></a>
        </logo>

        <search class="search">
            <input type="text" id="searchInput" placeholder="search for ...">
            <button id="searchButton">
                <img src="Assets/icons/eye icon.png">
            </button>
        </search>

     <button class="menu-btn">
            <a href="https://movie-finder-three-sandy.vercel.app/">
                <img src="Assets/icons/MovieFinder.png">
                <span class="menu-btn-text">MovieFinder</span>
            </a>
            <a href="789.html">
                <img src="Assets/icons/legal icon.png">
                <span class="menu-btn-text">Legal</span>
            </a>
        </button>
    </header>

    <section id="pictureBox" class="picture-box">
    <img src="Assets/images/welcome.png">
    <img src="Assets/images/40er tv.png">
    <img src="Assets/images/gitl 40 er.png">
    </section>


 <main class="movie-grid" id="movie-container">
    <!-- Template für eine einzelne Film-Karte -->
    <article class="movie-card">
      <img src="poster-placeholder.jpg" alt="Filmtitel Poster">
      <div class="movie-info">
        <h2 class="movie-title">Filmtitel</h2>
        <p class="movie-year">2026</p>
      </div>
    </article>
  </main>
    <script src="main.js"></script>
    <script src="api.js"></script>
</body>
</html>
