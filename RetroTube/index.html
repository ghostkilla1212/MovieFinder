<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RetroTube</title>
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="search.css">
    <link rel="stylesheet" href="mobile.css">
</head>
<body>
    <header>
        <a class="logo" href="index.html">
            <img src="Assets/logo.png/logo.png" alt="RetroTube home">
        </a>

        <form class="search" role="search" id="searchForm">
            <input type="search" id="searchInput" placeholder="Search retro movies ..." aria-label="Search retro movies">
            <button id="searchButton" type="submit" aria-label="Search">
                <img src="Assets/icons/eye icon.png" alt="">
            </button>
        </form>

        <nav class="menu-btn" aria-label="Main navigation">
            <a href="https://movie-finder-three-sandy.vercel.app/">
                <img src="Assets/icons/MovieFinder.png" alt="">
                <span class="menu-btn-text">MovieFinder</span>
            </a>
            <a href="789.html">
                <img src="Assets/icons/legal icon.png" alt="">
                <span class="menu-btn-text">Legal</span>
            </a>
        </nav>
    </header>

    <section id="pictureBox" class="picture-box" aria-label="RetroTube image carousel">
        <img src="Assets/images/welcome.png" alt="Welcome to RetroTube">
        <img src="Assets/images/40er tv.png" alt="A television from the 1940s">
        <img src="Assets/images/gitl 40 er.png" alt="A retro image from the 1940s">
    </section>

    <section class="assistant-panel" aria-labelledby="assistant-title">
        <h1 id="assistant-title">Ask RetroTube</h1>
        <p>Describe a movie, genre, or decade to search the retro movie collection.</p>
        <form class="assistant-form" id="assistantForm">
            <input
                type="text"
                id="assistantInput"
                placeholder="e.g. Find a horror movie from the 1940s"
                aria-label="Ask RetroTube to find a movie"
                required>
            <button type="submit">Ask</button>
        </form>
        <p class="assistant-response" id="assistantResponse" role="status" aria-live="polite">
            This local search helper understands movie titles, genres, and years.
        </p>
    </section>

    <main class="movie-grid" id="movie-container">
        <p class="movie-status" id="movie-status" role="status">Loading retro movies ...</p>
    </main>
    <script src="api.js"></script>
    <script src="main.js"></script>
</body>
</html>
