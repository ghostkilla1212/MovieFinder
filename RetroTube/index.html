<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RetroTube</title>
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="search.css">
    <link rel="stylesheet" href="mobile.css">
</head>
<body>
    <header>
        <a class="logo" href="index.html">
            <img src="Assets/logo.png/logo.png" alt="RetroTube Startseite">
        </a>

        <form class="search" role="search" id="searchForm">
            <input type="search" id="searchInput" placeholder="Retrofilme suchen ..." aria-label="Retrofilme suchen">
            <button id="searchButton" type="submit" aria-label="Suchen">
                <img src="Assets/icons/eye icon.png" alt="">
            </button>
        </form>

        <nav class="menu-btn" aria-label="Navigation">
            <a href="https://movie-finder-three-sandy.vercel.app/">
                <img src="Assets/icons/MovieFinder.png" alt="">
                <span class="menu-btn-text">MovieFinder</span>
            </a>
            <a href="789.html">
                <img src="Assets/icons/legal icon.png" alt="">
                <span class="menu-btn-text">Legal</span>
            </a>
        </nav>
    </header>

    <section id="pictureBox" class="picture-box" aria-label="RetroTube Bilder">
        <img src="Assets/images/welcome.png" alt="Willkommen bei RetroTube">
        <img src="Assets/images/40er tv.png" alt="Fernseher aus den 1940er Jahren">
        <img src="Assets/images/gitl 40 er.png" alt="Retro-Bild aus den 1940er Jahren">
    </section>

    <main class="movie-grid" id="movie-container">
        <p class="movie-status" id="movie-status" role="status">Retrofilme werden geladen ...</p>
    </main>
    <script src="api.js"></script>
    <script src="main.js"></script>
</body>
</html>
